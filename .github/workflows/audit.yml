name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
