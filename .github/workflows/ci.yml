name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: sh -n install.sh
        shell: bash
      - name: Check install.ps1 syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: ./tests/e2e.sh

  e2e-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: openssh-server
      - name: Prepare a test SSH server in WSL
        shell: wsl-bash {0}
        run: |
          echo 'root:tuxius-test-pw' | chpasswd
          mkdir -p /run/sshd
          ssh-keygen -A
      - name: e2e against the WSL server with Windows OpenSSH
        shell: bash
        env:
          TUXIUS_E2E_EXTERNAL: "1"
        run: |
          /c/Windows/System32/OpenSSH/ssh.exe -V
          MSYS_NO_PATHCONV=1 wsl -u root -e /usr/sbin/sshd -D -e -p 2222 -o PermitRootLogin=yes -o PasswordAuthentication=yes &
          ./tests/e2e.sh
