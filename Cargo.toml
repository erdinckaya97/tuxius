[package]
name = "tuxius"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Save your SSH servers once, connect with one keystroke. A tiny, modern SSH manager for the terminal."
license = "MIT"
repository = "https://github.com/erdinckaya97/tuxius"
homepage = "https://erdinckaya97.github.io/tuxius"
readme = "README.md"
keywords = ["ssh", "terminal", "cli", "server", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3"
toml = "1.2.1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["windows"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
